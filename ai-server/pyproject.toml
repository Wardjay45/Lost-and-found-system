[project]
name = "lost-found-ai"
version = "1.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.139.0", "uvicorn==0.51.0", "sentence-transformers==5.6.0",
  "transformers==5.13.0", "torch==2.11.0", "pillow==12.2.0",
  "numpy==2.4.4", "python-multipart==0.0.32", "requests>=2.32.3,<3",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
