<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="CLASS" style="width:790px;height:458px;background:#FFFFFF;" width="790px" height="458px" viewBox="0 0 790 458" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.7beta8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="legend" data-source-line="1"><rect x="12" y="22" width="759.376" height="417.422" fill="#DDD" style="stroke:#000;stroke-width:1;" rx="7.5" ry="7.5"/><text x="17" y="39.995" fill="#000" font-size="14" textLength="399.301">The plugin you are using seems to generated a bad URL.</text><text x="17" y="56.292" fill="#000" font-size="14" textLength="295.887">This URL does not look like DEFLATE data.</text><text x="17" y="72.589" fill="#000" font-size="14" textLength="367.664">It looks like your plugin is using HUFFMAN encoding.</text><text x="17" y="88.886" fill="#000" font-size="14"> </text><text x="17" y="105.183" fill="#000" font-size="14" textLength="671.706">This means you have now to add an header ~1 to your data. For example, you have to change:</text><text x="17" y="121.479" fill="#000" font-size="14" textLength="554.894">http://www.plantuml.com/plantuml/png/VLNVQzim47xtNt5aiBSmnjv7qsHXXU...</text><text x="17" y="137.776" fill="#000" font-size="14" textLength="14.055">to</text><text x="17" y="154.073" fill="#000" font-size="14" textLength="575.531">http://www.plantuml.com/plantuml/png/~1VLNVQzim47xtNt5aiBSmnjv7qsHXXU...</text><text x="17" y="170.37" fill="#000" font-size="14"> </text><text x="17" y="186.667" fill="#000" font-size="14" textLength="138.277">It will work this way</text><text x="17" y="202.964" fill="#000" font-size="14" textLength="428.148">You may contact the PlantUML team at plantuml@gmail.com</text><text x="17" y="219.261" fill="#000" font-size="14" textLength="749.376">But you should also probably contact the plugin authors you are currently using and send them this image</text><text x="17" y="235.558" fill="#000" font-size="14"> </text><text x="17" y="251.854" fill="#000" font-size="14" textLength="232.545">For the record, here is your data:</text><text x="17" y="268.151" fill="#000" font-size="14"> </text><text x="17" y="284.448" fill="#000" font-size="14" textLength="658.595">VLNVQzim47xtNt5aiBSmnjv7qsHXXUIX2TaO3CR5lZgYiXIaSuitzh_lP3LsP3iB9UK-tNttwNueTvxH</text><text x="17" y="300.745" fill="#000" font-size="14" textLength="716.263">SLrfM1ILCh12VpfQT0NCuU09bYXVAuMbmohBD3qni0MdoXD3eHpbhAp9_BCoPnGNE6F-Z2NjkT44uHXD</text><text x="17" y="317.042" fill="#000" font-size="14" textLength="721.649">gUdAeQ0dh3MlhU6z-atmyLEMOSxMmQnLC0FqKKkMTV5lPxsw6Vp9ChXaa-EQJsHOvHZqpE3TzvDY4YUG</text><text x="17" y="333.339" fill="#000" font-size="14" textLength="719.209">J-qf3zUORMpvbk2m_DKQetDRyvM3MEBnDqdLL-WzB0pgHh9woRW9DLasQ8PPlobwlQhhdf7z9KU09xmx</text><text x="17" y="349.636" fill="#000" font-size="14" textLength="682.097">NicnexDrVKGucegGHhmeRa1K-wiR-97-1wOAjcZ4gAHaelohDTIiX6HA-0VO4xhyzDDih6S8qLVydlyR</text><text x="17" y="365.933" fill="#000" font-size="14" textLength="657.323">ihQrATAO5ag3lXIA9MX5cgHdYNSuIftldNsL_mUJQrGL3TWxU7JjnvsK9ev7rwqVfBKTNJlM1jA0IF-u</text><text x="17" y="382.229" fill="#000" font-size="14" textLength="697.361">6_7kAzaVgIVd9sLAOLvebTEzhccod8k7w2jjzR867NCBZiYNuJ9X2BRaFPOnmGPVo1JaRkYECHVUQ4qw</text><text x="17" y="398.526" fill="#000" font-size="14" textLength="691.298">Haxg9VXo942U02VfbyXKMjUaSxDLdfkTzNHBIOnIVGf19kUbdO2GgszaC2PPMqaxgtlMrXWtfl4o6RUU</text><text x="17" y="414.823" fill="#000" font-size="14" textLength="689.965">WdWgWyeiLUseBlQ4oZLHSHJoRf2FCQNynSTfFl_Sloj3ABma2TPkVeAqcpsCyqF43tZYFYLGkpG9qgz5</text><text x="17" y="431.12" fill="#000" font-size="14" textLength="453.462">0iiu9tOSmWHwcv_KJGObTS9XlhPx2HIRb41TiTCB7RFiJWPSVfF-00</text></g><?plantuml-src ZLHBbweu4DxpA_83hhQ2hKsl1aH4vVqItNW2X8S6WX04MTpVFjWzT-wPpSniSaYglaTL9M2KeZ9ct0o12hTfNe8dQG6i4MYRl4n1Wr3H04h0c8PgI54C80XX33nRdOwml7bzWPYW1fI40ap83U3yXe2qa